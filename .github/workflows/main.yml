name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

  preview-deploy:
    name: Preview Deploy (PR)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Vercel credentials
        id: vercel_check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "Vercel preview skipped: missing VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID"
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel environment
        if: steps.vercel_check.outputs.enabled == 'true'
        run: npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build Vercel preview
        if: steps.vercel_check.outputs.enabled == 'true'
        run: npx vercel build --token=$VERCEL_TOKEN

      - name: Deploy to Vercel preview
        id: vercel_deploy
        if: steps.vercel_check.outputs.enabled == 'true'
        run: |
          echo "url=$(npx vercel deploy --prebuilt --token=$VERCEL_TOKEN)" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: steps.vercel_check.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel_deploy.outputs.url }}';
            if (!url) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Preview deploy disponível: ${url}`,
            });
